<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}} · 夜间版</title>
  <meta name="format-detection" content="telephone=no">
  <meta name="muse-updated" content="{{updated}}">
  <meta name="muse-status" content="{{muse_status}}">
  <style>{{css}}</style>
</head>
<body>
  <div class="wrap">
    <nav class="site-nav">{{nav}}</nav>
    <header class="top">
      <div>
        <div class="kicker">Night Edition · Live</div>
        <h1 class="page-title">国内外资讯</h1>
      </div>
      {{pill}}
    </header>
    {{banner}}
    {{hot}}
    {{sec_nav}}
    <main>
      {{content}}
    </main>
    <footer>
      <p>来源限定白名单，均为 48 小时内公开报道</p>
    </footer>
  </div>
  <a class="back-to-hot" href="#hot" aria-label="回到热门"><span class="back-to-hot-arrow" aria-hidden="true">↑</span><span class="back-to-hot-label">热门</span></a>
  <script>
  (function () {
    document.documentElement.classList.add("js");
    var boxes = document.querySelectorAll(".more-box");
    for (var i = 0; i < boxes.length; i++) {
      (function (box) {
        var c = box.querySelector(".collapse-btn");
        if (!c) return;
        c.addEventListener("click", function () {
          box.open = false;
          var sm = box.querySelector("summary");
          if (sm && sm.scrollIntoView) sm.scrollIntoView({ block: "center" });
        });
      })(boxes[i]);
    }
  })();
  (function () {
    var btn = document.querySelector(".back-to-hot");
    var hot = document.querySelector(".hot-zone");
    if (!btn || !hot || !("IntersectionObserver" in window)) return;
    var io = new IntersectionObserver(function (entries) {
      var e = entries[0];
      if (!e) return;
      if (e.isIntersecting) btn.setAttribute("hidden", "");
      else btn.removeAttribute("hidden");
    }, { threshold: 0 });
    io.observe(hot);
  })();
  </script>
</body>
</html>
