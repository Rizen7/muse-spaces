<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <style>{{css}}</style>
</head>
<body>
  <div class="wrap">
    <div class="index-top">
      <div class="kicker">Muse Spaces · Night</div>
      <h1>公开资讯页</h1>
      <p class="lead">手机和电脑都可以直接打开，不用登录。</p>
    </div>
    {{banner}}
    <main class="entries">
      <a class="card" href="news/">
        <span class="card-kicker">Night Edition</span>
        <h2>国内外资讯</h2>
        <p>AI、科技、经济、社会、文化、游戏，按国内 / 国际分栏。</p>
        <p class="space-meta"><span class="dot"></span>{{news_updated}}{{news_status}}</p>
        <span class="card-enter">进入 →</span>
      </a>
      <a class="card" href="deals/">
        <span class="card-kicker">Quest Board</span>
        <h2>薅羊毛</h2>
        <p>白嫖、限免、低价、币圈空投、NFT。</p>
        <p class="space-meta"><span class="dot"></span>{{deals_updated}}{{deals_status}}</p>
        <span class="card-enter">进入 →</span>
      </a>
    </main>
    <footer>
      <p>由公开报道整理，仅供查阅。</p>
    </footer>
  </div>
</body>
</html>
