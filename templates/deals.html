<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}} · 夜市任务板</title>
  <meta name="format-detection" content="telephone=no">
  <meta name="muse-updated" content="{{updated}}">
  <meta name="muse-status" content="{{muse_status}}">
  <style>{{css}}</style>
</head>
<body>
  <div class="wrap">
    <nav class="site-nav">{{nav}}</nav>
    <header class="top">
      <div>
        <div class="kicker">Night Market · Quest Board</div>
        <h1 class="page-title">薅羊毛</h1>
      </div>
      {{pill}}
    </header>
    {{banner}}
    {{hot}}
    {{tabs}}
    <main>
      {{content}}
    </main>
    <footer>
      <p>内容仅供参考，请以原文为准。标有「⚠ 风险高」的条目请谨慎对待。</p>
    </footer>
  </div>
  <a class="back-to-hot" href="#hot" aria-label="回到热门"><span class="back-to-hot-arrow" aria-hidden="true">↑</span><span class="back-to-hot-label">热门</span></a>
  <script>
  (function () {
    document.documentElement.classList.add("js");
  })();
  (function () {
    var btn = document.querySelector(".back-to-hot");
    var hot = document.querySelector(".hot-zone");
    if (!btn || !hot || !("IntersectionObserver" in window)) return;
    var io = new IntersectionObserver(function (entries) {
      var e = entries[0];
      if (!e) return;
      if (e.isIntersecting) btn.setAttribute("hidden", "");
      else btn.removeAttribute("hidden");
    }, { threshold: 0 });
    io.observe(hot);
  })();
  </script>
  {{filter_js}}
</body>
</html>
